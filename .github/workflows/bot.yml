name: Appy Forum Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# One run at a time. The "Start next session" step below dispatches the next
# run via the API (reliable, instant) right before each session ends; chain.yml
# and schedule remain as slow backups. Stop: disable BOTH workflows.
concurrency:
  group: appy-forum-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      # Queued runs were triggered up to 5 min ago -> sync to latest main so
      # the bot always starts with the newest seen.json (prevents duplicates).
      - name: Sync to latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run bot (5h45m per session)
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          LOG_CHANNEL_ID: '1482835040600588328'
          FORUM_CHANNEL_ID: '1555637461944897596'
          APPY_BOT_ID: '853327905357561948'
          DEBUG_DUMP: 'false'
          DRY_RUN: 'false'
        # SIGINT at 5h45m lets the bot flush state; 124 = clean timeout.
        run: timeout --signal=INT 20700 node src/index.js || [ $? -eq 124 ]

      # Reliable handoff: dispatch the next session via API from inside this
      # run. GitHub's schedule/workflow_run events proved unreliable (multi-hour
      # stalls); workflow_dispatch via GITHUB_TOKEN has been instant every time.
      - name: Start next session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run bot.yml --repo "${{ github.repository }}" --ref main

      - name: Keep schedule alive (guards 60-day inactivity auto-disable)
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt 3456000 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep scheduled workflow alive"
            git push origin HEAD:main
          fi
